<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reclamo inviato – Diatecx</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div class="brand">
      <span class="brand-name">DIATECX</span>
      <span class="brand-tag">THE COATING COMPANY</span>
    </div>
  </header>
  <main>
    <section>
      <h2>Reclamo inviato <span class="en">/ Claim sent</span></h2>
      <p id="claim-id" hidden>Numero reclamo / Claim number: <strong></strong></p>
      <p>Grazie, abbiamo ricevuto il tuo reclamo. Ti contatteremo al più presto.</p>
      <p class="en">Thank you, we have received your claim. We will get back to you as soon as possible.</p>
      <div class="actions">
        <a class="button" href="index.html">Nuovo reclamo <span class="en">/ New claim</span></a>
      </div>
    </section>
  </main>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    if (id) {
      document.querySelector('#claim-id strong').textContent = id;
      document.getElementById('claim-id').hidden = false;
    }
  </script>
</body>
</html>
